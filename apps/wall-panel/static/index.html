<!doctype html>
<!-- SYLTRA wall panel.

     A separate app from the console because it is a separate product. The
     console is somebody at a laptop deciding things; this is anybody walking
     past a wall. It is read from two or three metres, pressed with a thumb by
     someone not really looking, and it is on all day and all night.

     It shares the design system — the same tokens, the same fonts, the same
     RTL rules — and almost none of the console's layout. -->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SYLTRA</title>

  <!-- Fixed to the wall and never scrolled by hand: a pull-to-refresh or a
       rubber-band bounce on a panel is a gesture nobody meant to make. -->
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="32x32" href="/console/brand/syltra-icon-32.png">

  <link rel="stylesheet" href="/design-system/typography/fonts.css">
  <link rel="stylesheet" href="/design-system/tokens/tokens.css">
  <link rel="stylesheet" href="/design-system/themes/dark-theme.css">
  <link rel="stylesheet" href="/design-system/themes/light-theme.css">
  <link rel="stylesheet" href="/design-system/typography/typography.css">
  <link rel="stylesheet" href="/design-system/tokens/motion.css">
  <link rel="stylesheet" href="/design-system/foundation.css">
  <link rel="stylesheet" href="/design-system/primitives.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="panel-body">

  <!-- A confirmed hazard replaces the panel rather than appearing on it. This
       screen may be the only thing somebody sees, and a gas alarm beside the
       air-conditioning temperature is a gas alarm nobody notices. -->
  <div class="hazard" id="hazard" hidden role="alert" aria-live="assertive">
    <p class="hazard__what" id="hazard-what"></p>
    <p class="hazard__where" id="hazard-where"></p>
    <p class="hazard__done" id="hazard-done"></p>
  </div>

  <main class="panel" id="panel">
    <header class="panel__head">
      <div>
        <p class="panel__clock" id="clock" aria-hidden="true"></p>
        <p class="panel__place" id="place"></p>
      </div>
      <!-- One line, and the only thing on the panel that is always true or
           always false. Everything else is detail. -->
      <p class="panel__all-well" id="all-well"></p>
    </header>

    <!-- Outside, measured by this house.

         Not a forecast and not a service: every number in this band comes from
         a sensor on this building, which is why it is still here when the line
         to the internet is not. It says so, in small type, under the reading —
         because every other weather block anybody has seen means "somewhere
         near you, from somewhere else". -->
    <section class="weather" id="weather" hidden aria-labelledby="weather-heading">
      <h2 class="visually-hidden" id="weather-heading"></h2>
      <div class="weather__now">
        <!-- Two temperatures, because "41 outside" is half a fact. The half a
             household acts on is the difference between them. -->
        <div class="weather__reading" id="weather-outdoor">
          <p class="weather__where" id="weather-outdoor-where"></p>
          <p class="weather__temperature" id="weather-temperature"></p>
          <p class="weather__condition" id="weather-condition"></p>
          <p class="weather__feels" id="weather-feels"></p>
        </div>
        <div class="weather__reading" id="weather-indoor" hidden>
          <!-- Named with the room it was taken in. One thermometer does not
               speak for a house. -->
          <p class="weather__where" id="weather-indoor-where"></p>
          <p class="weather__temperature" id="weather-indoor-temperature"></p>
          <p class="weather__condition" id="weather-difference"></p>
        </div>
      </div>
      <dl class="weather__detail" id="weather-detail"></dl>
      <p class="weather__source" id="weather-source"></p>
    </section>

    <section class="panel__controls" id="controls" aria-labelledby="controls-heading">
      <h1 class="visually-hidden" id="controls-heading"></h1>
    </section>

    <footer class="panel__foot">
      <p class="panel__status" id="status"></p>
    </footer>
  </main>

  <script src="panel.js"></script>
</body>
</html>
