# Eclipse Mosquitto — SYLTRA development broker.
# Security posture (spec §25.2): no anonymous access, no default public listeners.
# The password file is generated locally at first `make up` (Phase 1) and is
# never committed; see infrastructure/scripts/.

persistence true
persistence_location /mosquitto/data/

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

log_dest stdout
log_type error
log_type warning
log_type notice
