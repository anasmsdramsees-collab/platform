[project]
name = "syltra-contracts"
version = "0.1.0"
description = "Canonical SYLTRA contracts: event envelope, capability registry, safety/privacy/policy enums"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_contracts"]
