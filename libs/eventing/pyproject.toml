[project]
name = "syltra-eventing"
version = "0.1.0"
description = "SYLTRA NATS JetStream helpers: subjects, streams, validated publishing, dead-letter"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nats-py>=2.10",
    "syltra-contracts",
]

[tool.uv.sources]
syltra-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_eventing"]
