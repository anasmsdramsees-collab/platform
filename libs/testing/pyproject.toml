[project]
name = "syltra-testing"
version = "0.1.0"
description = "Synthetic event factories and helpers for SYLTRA tests (spec §26: synthetic data only)"
requires-python = ">=3.12,<3.13"
dependencies = ["syltra-contracts", "syltra-digital-twin"]

[tool.uv.sources]
syltra-contracts = { workspace = true }
syltra-digital-twin = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_testing"]
