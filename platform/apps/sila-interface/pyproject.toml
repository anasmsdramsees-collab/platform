[project]
name = "syltra-sila"
version = "0.1.0"
description = "SILA: the structured intent interface between users and the SYLTRA platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "syltra-api-gateway",
    "syltra-contracts",
    "syltra-security",
]

[tool.uv.sources]
syltra-api-gateway = { workspace = true }
syltra-contracts = { workspace = true }
syltra-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_sila"]
