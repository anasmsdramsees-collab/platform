[project]
name = "syltra-simulator"
version = "0.1.0"
description = "Deterministic smart-home simulator with a mock Home Assistant WebSocket boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.11",
    "nats-py>=2.10",
    "syltra-contracts",
    "syltra-edge-agent",
    "syltra-eventing",
]

[project.scripts]
syltra-simulate = "syltra_simulator.run:cli"

[tool.uv.sources]
syltra-contracts = { workspace = true }
syltra-edge-agent = { workspace = true }
syltra-eventing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_simulator"]
