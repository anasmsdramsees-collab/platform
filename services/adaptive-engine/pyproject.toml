[project]
name = "syltra-adaptive-engine"
version = "0.1.0"
description = "SYLTRA Adaptive Engine: local routine, comfort and anomaly models producing advisory recommendations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.8",
    "nats-py>=2.10",
    "numpy>=2.1",
    "polars>=1.17",
    "scikit-learn>=1.6",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "skl2onnx>=1.18",
    "syltra-contracts",
    "syltra-digital-twin",
    "syltra-eventing",
    "syltra-observability",
]

[project.scripts]
syltra-adaptive-engine = "syltra_adaptive_engine.main:run"

[tool.uv.sources]
syltra-contracts = { workspace = true }
syltra-digital-twin = { workspace = true }
syltra-eventing = { workspace = true }
syltra-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_adaptive_engine"]
