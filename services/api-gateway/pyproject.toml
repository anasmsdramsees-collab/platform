[project]
name = "syltra-api-gateway"
version = "0.1.0"
description = "SYLTRA Local API Gateway: the only publicly exposed SYLTRA service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.8",
    "nats-py>=2.10",
    "syltra-action-orchestrator",
    "syltra-adaptive-engine",
    "syltra-contracts",
    "syltra-context-engine",
    "syltra-digital-twin",
    "syltra-eventing",
    "syltra-feedback-service",
    "syltra-observability",
    "syltra-policy-safety",
    "syltra-risk-engine",
    "syltra-security",
]

[project.scripts]
syltra-api-gateway = "syltra_api_gateway.main:run"

[tool.uv.sources]
syltra-action-orchestrator = { workspace = true }
syltra-adaptive-engine = { workspace = true }
syltra-contracts = { workspace = true }
syltra-context-engine = { workspace = true }
syltra-digital-twin = { workspace = true }
syltra-eventing = { workspace = true }
syltra-feedback-service = { workspace = true }
syltra-observability = { workspace = true }
syltra-policy-safety = { workspace = true }
syltra-risk-engine = { workspace = true }
syltra-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_api_gateway"]
