[project]
name = "syltra-digital-twin"
version = "0.1.0"
description = "SYLTRA Digital Twin: current home, room, device and capability state"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "nats-py>=2.10",
    "syltra-contracts",
    "syltra-eventing",
    "syltra-observability",
]

[project.scripts]
syltra-digital-twin = "syltra_digital_twin.main:run"

[project.optional-dependencies]
migrations = [
    "psycopg2-binary>=2.9.12",
]

[tool.uv.sources]
syltra-contracts = { workspace = true }
syltra-eventing = { workspace = true }
syltra-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_digital_twin"]
