[project]
name = "syltra-edge-agent"
version = "0.1.0"
description = "SYLTRA Edge Agent: Home Assistant gateway adapter, event normalization, JetStream publishing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.11",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.8",
    "syltra-contracts",
    "syltra-eventing",
    "syltra-observability",
]

[project.scripts]
syltra-edge-agent = "syltra_edge_agent.main:run"

[tool.uv.sources]
syltra-contracts = { workspace = true }
syltra-eventing = { workspace = true }
syltra-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_edge_agent"]
