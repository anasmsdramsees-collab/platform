<svg viewBox="0 0 1200 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">SYNTRA TV System Architecture</title>
  <desc id="desc">Data flows from licensed content providers through a normalization layer into PostgreSQL and Redis, then through the NestJS application API — supported by auth, streaming, subscriptions, smart home, and AI services — out to Flutter client apps on six platforms.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A525C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="940" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="60" y="42" font-size="13" font-weight="700" fill="#7C8794" letter-spacing="1.5">SYNTRA SMART</text>
  <text x="60" y="72" font-size="26" font-weight="700" fill="#0A1B3D">SYNTRA TV — System Architecture</text>
  <line x1="60" y1="86" x2="1140" y2="86" stroke="#B9C2CE" stroke-width="1.5"/>

  <!-- ============ 1. CONTENT PROVIDER LAYER ============ -->
  <text x="60" y="122" font-size="13" font-weight="700" fill="#555B66" letter-spacing="1">1 · CONTENT PROVIDER LAYER (LICENSED)</text>

  <g>
    <rect x="60" y="135" width="340" height="90" rx="10" fill="#0A1B3D"/>
    <text x="230" y="163" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Licensed IPTV Providers</text>
    <text x="230" y="184" text-anchor="middle" font-size="12" fill="#B9C2CE">Live channels · EPG · Playlists</text>
    <text x="230" y="202" text-anchor="middle" font-size="12" fill="#B9C2CE">REST API · Auth · HLS URLs</text>
  </g>
  <g>
    <rect x="430" y="135" width="340" height="90" rx="10" fill="#0A1B3D"/>
    <text x="600" y="163" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Licensed VOD Providers</text>
    <text x="600" y="184" text-anchor="middle" font-size="12" fill="#B9C2CE">Movies · Series · Categories</text>
    <text x="600" y="202" text-anchor="middle" font-size="12" fill="#B9C2CE">REST API · Auth · HLS URLs</text>
  </g>
  <g>
    <rect x="800" y="135" width="340" height="90" rx="10" fill="#0A1B3D"/>
    <text x="970" y="163" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Metadata &amp; EPG Providers</text>
    <text x="970" y="184" text-anchor="middle" font-size="12" fill="#B9C2CE">Program guide · Artwork</text>
    <text x="970" y="202" text-anchor="middle" font-size="12" fill="#B9C2CE">Automatic sync · Caching</text>
  </g>

  <path d="M600,225 L600,255" stroke="#4A525C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 2. NORMALIZATION LAYER ============ -->
  <text x="60" y="270" font-size="13" font-weight="700" fill="#555B66" letter-spacing="1">2 · NORMALIZATION LAYER</text>
  <rect x="60" y="282" width="1080" height="64" rx="10" fill="#4A525C"/>
  <text x="600" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Provider data normalized into one internal schema</text>
  <text x="600" y="328" text-anchor="middle" font-size="12" fill="#B9C2CE">Error handling · De-duplication · Category &amp; catalog mapping</text>

  <path d="M600,346 L600,376" stroke="#4A525C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 3. DATA LAYER ============ -->
  <text x="60" y="390" font-size="13" font-weight="700" fill="#555B66" letter-spacing="1">3 · DATA LAYER</text>
  <g>
    <rect x="60" y="402" width="520" height="70" rx="10" fill="#0A1B3D"/>
    <text x="320" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">PostgreSQL</text>
    <text x="320" y="452" text-anchor="middle" font-size="12" fill="#B9C2CE">Catalog, users, subscriptions, entitlements</text>
  </g>
  <g>
    <rect x="620" y="402" width="520" height="70" rx="10" fill="#0A1B3D"/>
    <text x="880" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Redis Cache</text>
    <text x="880" y="452" text-anchor="middle" font-size="12" fill="#B9C2CE">Playlists, EPG, session &amp; recommendation cache</text>
  </g>

  <path d="M600,472 L600,502" stroke="#4A525C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 4. APPLICATION API ============ -->
  <text x="60" y="516" font-size="13" font-weight="700" fill="#555B66" letter-spacing="1">4 · APPLICATION API (NESTJS)</text>
  <rect x="60" y="528" width="1080" height="140" rx="10" fill="#0A1B3D"/>
  <text x="600" y="554" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Unified Application API</text>

  <!-- service chips inside API box -->
  <g font-size="11.5" fill="#0A1B3D" font-weight="700">
    <rect x="90" y="568" width="160" height="34" rx="6" fill="#4A525C"/>
    <text x="170" y="590" text-anchor="middle" fill="#FFFFFF">Auth (JWT/OAuth)</text>

    <rect x="264" y="568" width="160" height="34" rx="6" fill="#4A525C"/>
    <text x="344" y="590" text-anchor="middle" fill="#FFFFFF">Streaming (HLS/DASH)</text>

    <rect x="438" y="568" width="160" height="34" rx="6" fill="#4A525C"/>
    <text x="518" y="590" text-anchor="middle" fill="#FFFFFF">Subscriptions &amp; Billing</text>

    <rect x="612" y="568" width="160" height="34" rx="6" fill="#4A525C"/>
    <text x="692" y="590" text-anchor="middle" fill="#FFFFFF">Smart Home Bridge</text>

    <rect x="786" y="568" width="160" height="34" rx="6" fill="#4A525C"/>
    <text x="866" y="590" text-anchor="middle" fill="#FFFFFF">AI Engine</text>

    <rect x="960" y="568" width="150" height="34" rx="6" fill="#4A525C"/>
    <text x="1035" y="590" text-anchor="middle" fill="#FFFFFF">Admin Dashboard</text>
  </g>
  <text x="600" y="650" text-anchor="middle" font-size="12" fill="#B9C2CE">Role-based access · Device authorization · Session management · HTTPS everywhere</text>

  <path d="M600,668 L600,698" stroke="#4A525C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 5. CLIENT APPS ============ -->
  <text x="60" y="712" font-size="13" font-weight="700" fill="#555B66" letter-spacing="1">5 · FLUTTER CLIENT APPS</text>

  <g font-size="12.5" font-weight="700" fill="#0A1B3D">
    <rect x="60" y="724" width="168" height="60" rx="10" fill="#FFFFFF" stroke="#0A1B3D" stroke-width="1.5"/>
    <text x="144" y="759" text-anchor="middle">Android TV</text>

    <rect x="242" y="724" width="168" height="60" rx="10" fill="#FFFFFF" stroke="#0A1B3D" stroke-width="1.5"/>
    <text x="326" y="759" text-anchor="middle">Google TV</text>

    <rect x="424" y="724" width="168" height="60" rx="10" fill="#FFFFFF" stroke="#0A1B3D" stroke-width="1.5"/>
    <text x="508" y="759" text-anchor="middle">Android Mobile</text>

    <rect x="606" y="724" width="168" height="60" rx="10" fill="#FFFFFF" stroke="#0A1B3D" stroke-width="1.5"/>
    <text x="690" y="759" text-anchor="middle">iPhone</text>

    <rect x="788" y="724" width="168" height="60" rx="10" fill="#FFFFFF" stroke="#0A1B3D" stroke-width="1.5"/>
    <text x="872" y="759" text-anchor="middle">Web</text>

    <rect x="970" y="724" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#0A1B3D" stroke-width="1.5"/>
    <text x="1055" y="759" text-anchor="middle">Tablet</text>
  </g>
  <text x="600" y="808" text-anchor="middle" font-size="12" font-style="italic" fill="#555B66">Future: Samsung TV (Tizen) · LG TV (webOS) · Apple TV (tvOS)</text>

  <!-- Footer -->
  <line x1="60" y1="850" x2="1140" y2="850" stroke="#B9C2CE" stroke-width="1"/>
  <text x="60" y="875" font-size="11" fill="#555B66">DRM-ready · Adaptive bitrate (HLS / MPEG-DASH via FFmpeg) · Deployed on Docker + Kubernetes behind a CDN</text>
  <text x="1140" y="875" font-size="11" fill="#555B66" text-anchor="end">SYNTRA TV — PRD v1.0</text>
</svg>
