[project]
name = "syltra-security"
version = "0.1.0"
description = "SYLTRA local authentication, roles and home-scoped authorization"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10", "syltra-contracts"]

[tool.uv.sources]
syltra-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_security"]
