[project]
name = "syltra-automation-engine"
version = "0.1.0"
description = "SYLTRA Automation Engine: deterministic user-authored rules, evaluated without the Adaptive Engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "syltra-contracts",
    "syltra-digital-twin",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_automation_engine"]

[tool.uv.sources]
syltra-contracts = { workspace = true }
syltra-digital-twin = { workspace = true }
