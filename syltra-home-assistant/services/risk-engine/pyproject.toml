[project]
name = "syltra-risk-engine"
version = "0.1.0"
description = "SYLTRA Risk Engine and Safety Governor: advisory risk inference and deterministic confirmation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.8",
    "nats-py>=2.10",
    "syltra-contracts",
    "syltra-digital-twin",
    "syltra-eventing",
    "syltra-observability",
]

[project.scripts]
syltra-risk-engine = "syltra_risk_engine.main:run"

[tool.uv.sources]
syltra-contracts = { workspace = true }
syltra-digital-twin = { workspace = true }
syltra-eventing = { workspace = true }
syltra-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syltra_risk_engine"]
